<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#f0abfc" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="#09090b"/>

  <!-- Tarot card silhouette -->
  <rect x="18" y="8" width="28" height="48" rx="4"
        fill="none" stroke="url(#cardGrad)" stroke-width="2.5"/>

  <!-- inner glow -->
  <circle cx="32" cy="28" r="16" fill="url(#glow)"/>

  <!-- 5-point star / pentacle in center -->
  <path d="M32 16 L35.05 24.55 L44 24.9 L36.9 30.55 L39.3 39.1 L32 34 L24.7 39.1 L27.1 30.55 L20 24.9 L28.95 24.55 Z"
        fill="url(#cardGrad)"/>

  <!-- bottom accent dot (like a moon/sparkle) -->
  <circle cx="32" cy="47" r="2.2" fill="#f0abfc"/>
</svg>
